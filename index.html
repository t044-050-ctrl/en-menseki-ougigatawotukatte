<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>円の面積（三角形による測定）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 画面比16:9の外は完全な白背景 */
    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      overflow: hidden;
    }

    /* 16:9比率維持メインステージ */
    .stage {
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      aspect-ratio: 16 / 9;
      background-color: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
    }

    .page {
      position: absolute;
      inset: 0;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      transform: scale(1);
      z-index: 1;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
      transform: scale(1);
    }

    /* 最初のアニメーション（拡大ズーム＆フェードアウト）の復元 */
    .page.zooming {
      opacity: 0;
      transform: scale(2.2);
    }

    /* 1/4円移動アニメーション用スタイル */
    .anim-clone {
      position: absolute;
      z-index: 100;
      pointer-events: none;
      transition: transform 0.65s cubic-bezier(0.25, 1, 0.4, 1), opacity 0.65s ease;
      transform-origin: top left;
    }

    .clickable-shape {
      cursor: pointer;
      transition: fill 0.15s ease, filter 0.15s ease;
    }
    .clickable-shape:hover {
      filter: brightness(0.95);
    }

    /* ==================== PAGE 1: トップ画面 ==================== */
    .top-grid-container {
      position: relative;
      width: clamp(300px, 46vw, 540px);
      height: clamp(300px, 46vw, 540px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ==================== PAGE 2: 拡大学習画面 ==================== */
    .left-panel {
      width: 52%;
      height: 100%;
      padding: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border-right: 2px solid #cbd5e1;
      position: relative;
    }

    .quarter-wrapper {
      position: relative;
      width: 100%;
      height: 98%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .right-panel {
      width: 48%;
      height: 100%;
      padding: 5% 4%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #ffffff;
      font-size: clamp(13px, 1.5vw, 20px);
      line-height: 1.8;
      color: #1e293b;
    }

    .statement-container {
      display: flex;
      flex-direction: column;
      gap: min(2.5vh, 20px);
    }

    .statement-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 行を変えずに1行に美しく納める設定 */
    .nowrap-row {
      white-space: nowrap;
      flex-wrap: nowrap !important;
      font-size: clamp(12px, 1.35vw, 18px);
    }

    .tri-icon {
      display: inline-block;
      width: clamp(22px, 2.2vw, 30px);
      height: clamp(18px, 1.8vw, 24px);
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* 穴埋め回答枠（水色枠・白塗りつぶし） */
    .fill-box {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: clamp(54px, 6vw, 82px);
      height: clamp(32px, 3.6vw, 44px);
      padding: 0 6px;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      background-color: #ffffff;
      cursor: pointer;
      font-weight: bold;
      font-size: clamp(14px, 1.6vw, 21px);
      color: #dc2626;
      transition: all 0.15s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .fill-box:hover {
      border-color: #0284c7;
      background-color: #f0f9ff;
      transform: translateY(-1px);
    }

    .hidden-text {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .visible-text {
      visibility: visible;
      opacity: 1;
    }
    /* ==================== PAGE 3: 「全円」ボタンで移動するページ (16等分された三角形) ==================== */
    .p3-container {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .bottom-control-bar {
      display: flex;
      justify-content: flex-end;
      gap: clamp(6px, 1vw, 12px);
      padding-top: 10px;
      width: 100%;
    }

    .btn {
      padding: clamp(6px, 1vh, 10px) clamp(10px, 1.2vw, 18px);
      font-size: clamp(11px, 1.15vw, 15px);
      font-weight: bold;
      border: 2px solid #888;
      border-radius: 8px;
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-top {
      border-color: #6366f1;
      color: #4338ca;
      background-color: #eef2ff;
    }
    .btn-top:hover { background-color: #e0e7ff; }

    .btn-reset {
      border-color: #f97316;
      color: #c2410c;
      background-color: #fff7ed;
    }
    .btn-reset:hover { background-color: #ffedd5; }

    .btn-finish {
      border-color: #0284c7;
      color: #0369a1;
      background-color: #f0f9ff;
    }
    .btn-finish:hover { background-color: #e0f2fe; }

    .btn-complete {
      border-color: #16a34a;
      color: #15803d;
      background-color: #f0fdf4;
    }
    .btn-complete:hover { background-color: #dcfce7; }

    .toggle-tri {
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .toggle-tri.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="stage">

    <!-- ==================== PAGE 1: トップ画面 (教科書と同じ図形) ==================== -->
    <div id="page1" class="page active">
      <div class="top-grid-container">
        <svg width="100%" height="100%" viewBox="0 0 500 500" id="page1-svg">
          <!-- 切れ目のない3/4の円 (90°〜360°) : 薄橙色 #ffedd5 (操作不可・ボタン機能なし) -->
          <path d="M 250 250 L 250 20 A 230 230 0 1 0 480 250 Z" 
                fill="#ffedd5" stroke="#1e293b" stroke-width="2.5" pointer-events="none" />

          <!-- 右上1/4の円領域 (0°〜90°) : どこをタップしても色変わらず2ページ目へ移動 -->
          <g id="page1-quarter" onclick="goToPage2()" style="cursor: pointer;">
            <!-- Triangle 4 (67.5°〜90°) -->
            <polygon points="250,250 250,20 337.93,36.84" fill="#fef3c7" stroke="#1e293b" stroke-width="2" />

            <!-- Triangle 3 (45°〜67.5°) -->
            <polygon points="250,250 337.93,36.84 412.63,87.37" fill="#fef3c7" stroke="#1e293b" stroke-width="2" />

            <!-- Triangle 2 (22.5°〜45°) -->
            <polygon points="250,250 412.63,87.37 462.41,162.07" fill="#fef3c7" stroke="#1e293b" stroke-width="2" />

            <!-- Triangle 1 一番下の三角形 (0°〜22.5°) : 薄橙色 #ffedd5 -->
            <polygon points="250,250 462.41,162.07 480,250" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5" />

            <!-- 一番下の三角形内部の高さ（点線）と直角記号 -->
            <line x1="250" y1="250" x2="471.25" y2="205.99" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" pointer-events="none"/>
            <path d="M 463 208 L 461 199 L 469 197" fill="none" stroke="#1e293b" stroke-width="1.2" pointer-events="none"/>
          </g>

          <!-- 外周円輪郭 -->
          <circle cx="250" cy="250" r="230" fill="none" stroke="#1e293b" stroke-width="3" pointer-events="none"/>
        </svg>
      </div>
    </div>

    <!-- ==================== PAGE 2: 拡大学習画面 ==================== -->
    <div id="page2" class="page">
      <div class="left-panel">
        <div class="quarter-wrapper">
          <svg width="100%" height="100%" viewBox="-10 -10 540 440" preserveAspectRatio="xMidYMid meet" id="quarter-svg">
            <!-- 扇形背景: 隙間を白(#ffffff)にする下地 (高精度なアニメーション位置合わせに使用) -->
            <path id="page2-arc-bg" d="M 10 410 L 410 410 A 400 400 0 0 0 10 10 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>

            <!-- 上の3つの小三角形 (薄黄色) -->
            <polygon class="toggle-tri upper-tri" points="10,410 163.07,40.59 10,10" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
            <polygon class="toggle-tri upper-tri" points="10,410 292.84,127.16 163.07,40.59" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
            <polygon class="toggle-tri upper-tri" points="10,410 379.41,256.93 292.84,127.16" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>

            <!-- 一番下の三角形 (薄橙色) : タップで上の3つの非表示/表示トグル -->
            <polygon points="10,410 410,410 379.41,256.93" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" 
                     style="cursor: pointer;" onclick="toggleOtherTriangles()"/>

            <!-- 底辺 & 高さの強線 -->
            <line x1="410" y1="410" x2="379.41" y2="256.93" stroke="#b91c1c" stroke-width="4" pointer-events="none"/>
            <line x1="10" y1="410" x2="394.7" y2="333.46" stroke="#0284c7" stroke-width="3" stroke-dasharray="6 4" pointer-events="none"/>

            <!-- 直角マーク -->
            <path d="M 383 335.7 L 380.6 323.7 L 392.3 321.4" fill="none" stroke="#0284c7" stroke-width="2" pointer-events="none"/>

            <!-- ラベル (直線と重ならず、かつ絶対に見切れない配置 + 白縁取りで視認性を確保) -->
            <text x="180" y="320" font-size="28" font-weight="bold" fill="#0284c7" stroke="#ffffff" stroke-width="6" paint-order="stroke fill" pointer-events="none">高さ</text>
            <text x="418" y="345" font-size="28" font-weight="bold" fill="#b91c1c" stroke="#ffffff" stroke-width="6" paint-order="stroke fill" pointer-events="none">底辺</text>

            <!-- 外枠の円弧および半径 -->
            <path d="M 10 410 L 410 410 A 400 400 0 0 0 10 10 Z" fill="none" stroke="#1e293b" stroke-width="3" pointer-events="none"/>
          </svg>
        </div>
      </div>

      <div class="right-panel">
        <div class="statement-container">
          <!-- 行 1: 説明（改行せずに1行で美しく表示） -->
          <div class="statement-row nowrap-row">
            <svg class="tri-icon" viewBox="0 0 30 24">
              <polygon points="2,22 28,22 22,2" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
            </svg>
            <span>の三角形の底辺と高さをはかって面積を調べると、</span>
          </div>

          <!-- 行 2: 底辺と高さ -->
          <div class="statement-row">
            底辺は
            <div class="fill-box toggle-box" id="box-base" onclick="toggleAnswer(this)">
              <span class="hidden-text">3.9</span>
            </div> cm、高さは
            <div class="fill-box toggle-box" id="box-height" onclick="toggleAnswer(this)">
              <span class="hidden-text">9.8</span>
            </div> cmだから、
          </div>

          <!-- 行 3: 三角形の面積 -->
          <div class="statement-row">
            面積は
            <div class="fill-box toggle-box" id="box-tri-area" onclick="toggleAnswer(this)">
              <span class="hidden-text">19.11</span>
            </div> cm²
          </div>

          <div style="height: 10px;"></div>

          <!-- 行 4: 円全体の面積式 -->
          <div class="statement-row">
            円全体の面積は、
            <div class="fill-box toggle-box" id="box-formula-part" onclick="toggleAnswer(this)">
              <span class="hidden-text">19.11</span>
            </div> × 16 ＝
            <div class="fill-box toggle-box" id="box-total-exact" onclick="toggleAnswer(this)">
              <span class="hidden-text">305.76</span>
            </div>
          </div>

          <!-- 行 5: およその答え -->
          <div class="statement-row" style="justify-content: flex-end; margin-top: 10px;">
            およそ
            <span class="underline-ans">
              <div class="fill-box toggle-box" id="box-approx" onclick="toggleAnswer(this)">
                <span class="hidden-text">306</span>
              </div>
            </span> cm²
          </div>
        </div>

        <!-- 右下 操作ボタンエリア -->
        <div class="bottom-control-bar">
          <button class="btn btn-top" onclick="goToPage3()">全円</button>
          <button class="btn btn-reset" onclick="resetAll()">↺ やり直し</button>
          <button class="btn btn-finish" onclick="finishCounting()">測る</button>
          <button class="btn btn-complete" onclick="completeAll()">完成</button>
        </div>
      </div>
    </div>

    <!-- ==================== PAGE 3: 「全円」ボタンで移動するページ (16等分された三角形) ==================== -->
    <div id="page3" class="page p3-container">
      <div class="top-grid-container p3-container">
        <svg width="100%" height="100%" viewBox="0 0 500 500" id="page3-svg" style="touch-action: none;">
          <!-- 16等分の三角形群（JSで生成） -->
          <g id="p3-16-triangles"></g>

          <!-- 元の三角形（0°〜22.5°）内部の高さ（点線）と直角記号 -->
          <line x1="250" y1="250" x2="471.25" y2="205.99" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" pointer-events="none"/>
          <path d="M 463 208 L 461 199 L 469 197" fill="none" stroke="#1e293b" stroke-width="1.2" pointer-events="none"/>

          <!-- 外周円輪郭 -->
          <circle cx="250" cy="250" r="230" fill="none" stroke="#1e293b" stroke-width="3" pointer-events="none"/>
        </svg>
      </div>

      <!-- 右下に学習画面(Page 2)に戻るボタン -->
      <div style="position: absolute; bottom: 20px; right: 20px;">
        <button class="btn btn-top" onclick="showPage('page2')">学習画面へ戻る</button>
      </div>
    </div>

  </div>

  <script>
    // ページ3の16個の三角形の状態（true: 色付き, false: 白色）
    // 元の三角形 (index 0) のみ初期状態で色付き (#ffedd5)
    const p3TriangleStates = new Array(16).fill(false);
    p3TriangleStates[0] = true;

    // 2ページ目の上の3つの三角形の表示フラグ
    let areUpperTrianglesVisible = true;

    // Page 3 のスワイプ（ドラッグ）状態管理変数
    let isP3PointerDown = false;
    let lastEnteredIndex = -1;
    let hasDraggedMultiple = false;
    let pointerDownIndex = -1;

    // --- Page 3: 16個の三角形をSVGに動的生成 ---
    function renderPage3Triangles() {
      const container = document.getElementById('p3-16-triangles');
      if (!container) return;
      container.innerHTML = '';

      const cx = 250, cy = 250, r = 230;

      for (let i = 0; i < 16; i++) {
        const angle1 = (i * 22.5) * (Math.PI / 180);
        const angle2 = ((i + 1) * 22.5) * (Math.PI / 180);

        const x1 = cx + r * Math.cos(angle1);
        const y1 = cy - r * Math.sin(angle1);
        const x2 = cx + r * Math.cos(angle2);
        const y2 = cy - r * Math.sin(angle2);

        const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        polygon.setAttribute("points", `${cx},${cy} ${x1.toFixed(2)},${y1.toFixed(2)} ${x2.toFixed(2)},${y2.toFixed(2)}`);
        polygon.setAttribute("id", `p3-tri-${i}`);
        polygon.setAttribute("data-index", i);
        polygon.setAttribute("class", "clickable-shape p3-tri-shape");
        polygon.setAttribute("stroke", "#1e293b");
        polygon.setAttribute("stroke-width", "1.5");

        updateP3TriangleFill(i, polygon);

        container.appendChild(polygon);
      }

      setupP3SwipeEvents();
    }

    function setupP3SwipeEvents() {
      const svg = document.getElementById('page3-svg');
      if (!svg || svg.getAttribute('data-swipe-init')) return;
      svg.setAttribute('data-swipe-init', 'true');

      // 画面上のタッチ・マウスポインタ座標から対応する三角形のインデックス(0〜15)を数学的に精密計算
      function getTriIndexFromPoint(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        if (!rect || rect.width === 0 || rect.height === 0) return -1;

        // SVG内の相対座標(0〜500)に変換
        const svgX = ((clientX - rect.left) / rect.width) * 500;
        const svgY = ((clientY - rect.top) / rect.height) * 500;

        const cx = 250, cy = 250;
        const dx = svgX - cx;
        const dy = cy - svgY; // SVGはY軸が下向きのため反転
        const dist = Math.sqrt(dx * dx + dy * dy);

        // 円の範囲外（少し余裕をもたせて半径245px）の場合は無効
        if (dist > 245) return -1;

        // 角度（ラジアン）の計算 (0°〜360°)
        let angleRad = Math.atan2(dy, dx);
        if (angleRad < 0) angleRad += 2 * Math.PI;

        const angleDeg = angleRad * (180 / Math.PI);

        // 22.5度ごとのインデックスを算出
        let idx = Math.floor(angleDeg / 22.5);
        if (idx < 0) idx = 0;
        if (idx > 15) idx = 15;
        return idx;
      }

      function handleStart(x, y) {
        const idx = getTriIndexFromPoint(x, y);
        if (idx !== -1) {
          isP3PointerDown = true;
          hasDraggedMultiple = false;
          pointerDownIndex = idx;
          lastEnteredIndex = idx;
          toggleP3Triangle(idx);
        }
      }

      function handleMove(x, y) {
        if (!isP3PointerDown) return;
        const idx = getTriIndexFromPoint(x, y);
        if (idx !== -1 && idx !== lastEnteredIndex) {
          hasDraggedMultiple = true;
          lastEnteredIndex = idx;
          toggleP3Triangle(idx);
        }
      }

      function handleEnd() {
        if (isP3PointerDown) {
          // なぞり移動なしで「元の三角形(index 0)」をタップした場合は学習画面(Page 2)へ移動
          if (!hasDraggedMultiple && pointerDownIndex === 0) {
            showPage('page2');
          }
          isP3PointerDown = false;
          lastEnteredIndex = -1;
          pointerDownIndex = -1;
          hasDraggedMultiple = false;
        }
      }

      // ポインタ/タッチイベントの設定 (マルチデバイス対応 & スクロール防止)
      if (window.PointerEvent) {
        svg.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          try { svg.setPointerCapture(e.pointerId); } catch(err) {}
          handleStart(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
          if (isP3PointerDown) {
            e.preventDefault();
            handleMove(e.clientX, e.clientY);
          }
        });

        window.addEventListener('pointerup', (e) => {
          if (isP3PointerDown) {
            try { svg.releasePointerCapture(e.pointerId); } catch(err) {}
            handleEnd();
          }
        });

        window.addEventListener('pointercancel', (e) => {
          if (isP3PointerDown) {
            try { svg.releasePointerCapture(e.pointerId); } catch(err) {}
            handleEnd();
          }
        });
      } else {
        // フォールバック用タッチイベント処理
        svg.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) {
            e.preventDefault();
            const t = e.touches[0];
            handleStart(t.clientX, t.clientY);
          }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
          if (isP3PointerDown && e.touches.length > 0) {
            e.preventDefault();
            const t = e.touches[0];
            handleMove(t.clientX, t.clientY);
          }
        }, { passive: false });

        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchcancel', handleEnd);
      }
    }

    function updateP3TriangleFill(index, element) {
      const el = element || document.getElementById(`p3-tri-${index}`);
      if (!el) return;

      if (p3TriangleStates[index]) {
        el.setAttribute('fill', index === 0 ? '#ffedd5' : '#fef3c7');
      } else {
        el.setAttribute('fill', '#ffffff');
      }
    }

    function toggleP3Triangle(index) {
      p3TriangleStates[index] = !p3TriangleStates[index];
      updateP3TriangleFill(index);
    }

    // --- ページ遷移制御（最初のアニメーションを復元） ---
    function showPage(pageId) {
      const pages = document.querySelectorAll('.page');
      pages.forEach(p => {
        p.classList.remove('active');
        p.classList.remove('zooming');
      });

      const target = document.getElementById(pageId);
      if (target) {
        target.classList.add('active');
      }
    }

    function goToPage1() { showPage('page1'); }

    // トップページ(Page 1)の右上1/4円が、2ページ目の1/4円の正確なサイズへ拡大移動するアニメーション
    function goToPage2() {
      const p1 = document.getElementById('page1');
      const p2 = document.getElementById('page2');
      const quarter1 = document.getElementById('page1-quarter');
      const arc2 = document.getElementById('page2-arc-bg');
      const stage = document.querySelector('.stage');

      if (!p1 || !p2 || !quarter1 || !arc2 || !stage) {
        showPage('page2');
        return;
      }

      if (p1.classList.contains('animating')) return;
      p1.classList.add('animating');

      const stageRect = stage.getBoundingClientRect();

      // 1. Page 1 の 1/4円の正確な画面表示領域（ピクセル単位）を取得
      const rect1 = quarter1.getBoundingClientRect();

      // 2. Page 2 を一時的に配置し、目的地の正確な画面表示領域を取得
      p2.style.display = 'flex';
      p2.style.opacity = '0';
      p2.style.pointerEvents = 'none';
      p2.classList.add('active');

      const rect2 = arc2.getBoundingClientRect();

      // 3. 移動用SVGクローン要素を作成（始点位置とサイズを完全同期）
      const svgClone = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgClone.setAttribute("width", rect1.width);
      svgClone.setAttribute("height", rect1.height);
      svgClone.setAttribute("viewBox", "250 20 230 230"); // 1ページ目の右上1/4円のSVG領域
      svgClone.className.baseVal = "anim-clone";
      svgClone.style.left = (rect1.left - stageRect.left) + "px";
      svgClone.style.top = (rect1.top - stageRect.top) + "px";
      svgClone.style.width = rect1.width + "px";
      svgClone.style.height = rect1.height + "px";
      svgClone.style.transformOrigin = "top left";
      svgClone.innerHTML = quarter1.innerHTML;

      stage.appendChild(svgClone);

      // 背景のフェードアウト
      quarter1.style.opacity = '0';
      p1.style.transition = 'opacity 0.45s ease';
      p1.style.opacity = '0';

      // 4. 精密な位置・スケール計算による滑らかな拡大移動
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const dx = rect2.left - rect1.left;
          const dy = rect2.top - rect1.top;
          const scale = rect2.width / rect1.width;

          svgClone.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;

          // アニメーション終盤（移動完了前）にほんのりフェードインさせて自然に馴染ませる
          setTimeout(() => {
            p2.style.transition = "opacity 0.28s ease";
            p2.style.opacity = "1";
          }, 380);
        });
      });

      // 5. アニメーション完了後のクリーンアップ
      setTimeout(() => {
        p1.classList.remove('active', 'animating');
        p1.style.opacity = '';
        p1.style.transition = '';
        p2.classList.remove('active');
        p2.style.display = '';
        p2.style.opacity = '';
        p2.style.transition = '';
        p2.style.pointerEvents = '';
        quarter1.style.opacity = '';

        showPage('page2');

        if (svgClone.parentNode) {
          svgClone.parentNode.removeChild(svgClone);
        }
      }, 650);
    }

    function goToPage3() { showPage('page3'); }

    // --- Page 2: 一番下の三角形タップで上の3つをトグル切り替え ---
    function toggleOtherTriangles() {
      areUpperTrianglesVisible = !areUpperTrianglesVisible;
      const uppers = document.querySelectorAll('.upper-tri');
      uppers.forEach(el => {
        if (areUpperTrianglesVisible) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    }

    // --- 穴埋め枠のトグル表示 ---
    function toggleAnswer(el) {
      const textSpan = el.querySelector('span');
      if (textSpan) {
        if (textSpan.classList.contains('hidden-text')) {
          textSpan.classList.remove('hidden-text');
          textSpan.classList.add('visible-text');
        } else {
          textSpan.classList.remove('visible-text');
          textSpan.classList.add('hidden-text');
        }
      }
    }

    // --- コントロールボタン機能 ---
    function resetAll() {
      // 2ページ目の上の3つの三角形を表示状態に戻す
      areUpperTrianglesVisible = true;
      const uppers = document.querySelectorAll('.upper-tri');
      uppers.forEach(el => el.classList.remove('hidden'));

      // Page 3 の三角形の色状態をリセット
      p3TriangleStates[0] = true;
      for (let i = 1; i < 16; i++) {
        p3TriangleStates[i] = false;
      }
      for (let i = 0; i < 16; i++) {
        updateP3TriangleFill(i);
      }

      // 穴埋め非表示化
      const answers = document.querySelectorAll('.toggle-box span');
      answers.forEach(span => {
        span.classList.remove('visible-text');
        span.classList.add('hidden-text');
      });
    }

    function finishCounting() {
      const baseBox = document.getElementById('box-base').querySelector('span');
      const heightBox = document.getElementById('box-height').querySelector('span');
      
      if (baseBox) {
        baseBox.classList.remove('hidden-text');
        baseBox.classList.add('visible-text');
      }
      if (heightBox) {
        heightBox.classList.remove('hidden-text');
        heightBox.classList.add('visible-text');
      }
    }

    function completeAll() {
      areUpperTrianglesVisible = true;
      const uppers = document.querySelectorAll('.upper-tri');
      uppers.forEach(el => el.classList.remove('hidden'));

      const answers = document.querySelectorAll('.toggle-box span');
      answers.forEach(span => {
        span.classList.remove('hidden-text');
        span.classList.add('visible-text');
      });
    }

    window.onload = function() {
      renderPage3Triangles();
    };
  </script>
</body>
</html>
